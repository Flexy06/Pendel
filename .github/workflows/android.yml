name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Core unit tests (algorithms)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pendel-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Room schemas (commit 2.json into the repo)
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests
          if-no-files-found: ignore

      # Rolling pre-release "latest-debug": the APK can be downloaded directly on the phone.
      - name: Publish APK as pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Pendel (Debug-Build)
          prerelease: true
          make_latest: false
          body: |
            Automatischer Debug-Build von ${{ github.sha }}.
            Installieren: APK auf dem Handy öffnen (Installation aus unbekannten Quellen erlauben).
          files: app/build/outputs/apk/debug/*.apk
